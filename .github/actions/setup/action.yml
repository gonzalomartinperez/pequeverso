name: Setup
description: >-
  Node from .nvmrc with the npm cache, `npm ci`, and optionally one Playwright browser restored
  from a cache keyed by the Playwright version. Checkout is left to the caller.

inputs:
  browser:
    description: Playwright browser to install (chromium | webkit | firefox); empty installs none
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Resolve Playwright version
      if: inputs.browser != ''
      id: playwright
      shell: bash
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Restore Playwright browser
      if: inputs.browser != ''
      id: browser-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ inputs.browser }}

    - name: Install Playwright browser
      if: inputs.browser != '' && steps.browser-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        BROWSER: ${{ inputs.browser }}
      run: npx playwright install "$BROWSER"

    - name: Install browser system dependencies
      if: inputs.browser != ''
      shell: bash
      env:
        BROWSER: ${{ inputs.browser }}
      run: npx playwright install-deps "$BROWSER"
