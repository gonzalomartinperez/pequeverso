name: Bug report
description: Something in the website or its tooling does not work as documented.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets, customer data or payment details. For vulnerabilities use the private security advisory link instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open /...\n2. Click ...\n3. See ..."
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: URL or file
      description: Page URL, or file path and commit SHA.
  - type: dropdown
    id: target
    attributes:
      label: Build target
      options:
        - Static export
        - Node standalone
        - Both
        - Not sure
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser, device and viewport
      placeholder: "Firefox 140, Android, 390 px"
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Console output, command output or screenshots.
