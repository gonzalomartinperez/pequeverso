version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # One grouped PR per week for every minor/patch bump: a single lockfile change, so merging it
    # never leaves a second Dependabot PR conflicting or behind the strict up-to-date rule.
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
      semver-major-days: 21
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /tools/media
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      # Types follow the Node LTS in .nvmrc (Hostinger builds on it); Current lines are skipped.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    # `/` covers .github/workflows; the glob covers composite actions under .github/actions.
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
