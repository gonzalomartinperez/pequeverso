version: 2

# One weekly PR for every ecosystem (owner rule, ecosystem.md section 5): the multi-ecosystem group
# `weekly-all` carries the schedule and target; each entry below joins it. Version updates target
# develop (the integration branch); Hostinger builds main, so nothing deploys from these PRs.
# Security-update PRs are disabled in repository settings; alerts stay on and ride the weekly PR.
multi-ecosystem-groups:
  weekly-all:
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Argentina/Buenos_Aires
    target-branch: develop
    open-pull-requests-limit: 1
    labels:
      - dependencies

updates:
  - package-ecosystem: npm
    directory: /
    multi-ecosystem-group: weekly-all
    patterns: ["*"]
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-patch-days: 3
    ignore:
      # Types follow the Node LTS in .nvmrc (Hostinger builds on it); Current lines are skipped.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Framework majors are planned migrations, not weekly bumps.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      # Playwright 1.64.0 bundles a Linux WebKit (27.2, build 2370) that stops rendering updates
      # (no requestAnimationFrame, IntersectionObserver or pagereveal) once backdrop-filter surfaces
      # are scrolled into view; the webkit-390 text-zoom spec fails on it with any app code. Only
      # this exact version is skipped: the next release is proposed and has to pass CI.
      - dependency-name: "@playwright/test"
        versions: ["1.64.0"]
  - package-ecosystem: npm
    directory: /tools/media
    multi-ecosystem-group: weekly-all
    patterns: ["*"]
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-patch-days: 3
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    # `/` covers .github/workflows; the glob covers composite actions under .github/actions.
    directories: ["/", "/.github/actions/*"]
    multi-ecosystem-group: weekly-all
    patterns: ["*"]
    cooldown:
      default-days: 7
