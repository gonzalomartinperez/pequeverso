version: 2
updates:
  # Version updates target develop (the default and integration branch); security updates are
  # raised by GitHub against the default branch and are never auto-merged.
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    # Two grouped minor/patch PRs per week: `frameworks` (always human review, see
    # dependabot-automerge.yml REVIEW_REQUIRED; keep both lists in sync) and `npm-minor-patch`
    # (everything else, eligible for the fail-closed auto-merge into develop). Majors come alone.
    open-pull-requests-limit: 4
    cooldown:
      default-days: 7
      semver-major-days: 21
    groups:
      frameworks:
        patterns:
          - next
          - "@next/bundle-analyzer"
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
          - typescript
          - tailwindcss
          - "@tailwindcss/postcss"
          - "@base-ui/react"
          - zod
          - "@playwright/test"
        update-types: [minor, patch]
      npm-minor-patch:
        patterns: ["*"]
        exclude-patterns:
          - next
          - "@next/bundle-analyzer"
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
          - typescript
          - tailwindcss
          - "@tailwindcss/postcss"
          - "@base-ui/react"
          - zod
          - "@playwright/test"
        update-types: [minor, patch]
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      # Playwright 1.64.0 bundles a Linux WebKit (27.2, build 2370) that stops rendering updates
      # (no requestAnimationFrame, IntersectionObserver or pagereveal) once backdrop-filter surfaces
      # are scrolled into view; the webkit-390 text-zoom spec fails on it with any app code. Only
      # this exact version is skipped: the next release is proposed and has to pass CI.
      - dependency-name: "@playwright/test"
        versions: ["1.64.0"]
  - package-ecosystem: npm
    directory: /tools/media
    target-branch: develop
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      # Types follow the Node LTS in .nvmrc (Hostinger builds on it); Current lines are skipped.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    # `/` covers .github/workflows; the glob covers composite actions under .github/actions.
    directories: ["/", "/.github/actions/*"]
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
