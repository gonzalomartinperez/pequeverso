name: Scorecard

# OpenSSF Scorecard, weekly (ecosystem section 7): results go to code scanning (SARIF) and to the
# public Scorecard API for the badge. The ceilings on Code-Review and Branch-Protection for a solo
# repository are accepted (docs/master-plan/ci-cd.md section 5). The "fail when the score drops by
# more than one point" rule needs a stored baseline and lands with the M1-9 ratchets.
on:
  schedule:
    - cron: "17 7 * * 1" # Monday 07:17 UTC
  push:
    branches: [develop]
  workflow_dispatch:

permissions: {}

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # upload the SARIF to code scanning
      id-token: write # publish_results: sign the results for the public Scorecard API
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - name: Keep the SARIF as an artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: scorecard.sarif
          retention-days: 30
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: scorecard.sarif
