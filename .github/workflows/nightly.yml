# Scheduled validation only. Manual snapshot regeneration remains explicit and is not comparison acceptance.
name: Nightly
'on':
  schedule:
    - cron: 17 4 * * *
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Regenerate visual baselines and upload them as an artifact
        type: boolean
        default: false
permissions: {}
concurrency:
  group: nightly
  cancel-in-progress: false
env:
  NEXT_TELEMETRY_DISABLED: '1'
  NEXT_PUBLIC_SITE_URL: https://pequeverso.com
  NEXT_PUBLIC_CHECKOUT_URL_GRAFISMO_FONETICO: https://pay.hotmart.com/TEST0000000?checkoutMode=10
  NEXT_OUTPUT: export
  NEXT_PUBLIC_ASSISTANT_ENABLED: 'false'
  NEXT_PUBLIC_ASSISTANT_API_ORIGIN: ''
jobs:
  prepare:
    name: Nightly prepare candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Freeze the checked candidate identity
        run: |-
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          [[ "$actual" == "$GITHUB_SHA" ]] || { echo "Candidate checkout mismatch" >&2; exit 1; }
          echo "source_sha=$actual" >> "$GITHUB_OUTPUT"
        id: identity
  quality:
    name: Nightly quality checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup
        with:
          browser: chromium
      - name: Dead code (full)
        run: npm run knip
      - name: Build the no-integration default-OFF export
        run: npm run build
      - name: Bundle budget
        run: npm run check:bundle
      - name: Verify exported edge rules
        run: cmp out/.htaccess docs/generated/htaccess.txt
      - name: Clean clone retains no banner or cookies
        run: npx playwright test --project=chromium-1440 tests/e2e/consent.spec.ts tests/e2e/commerce.spec.ts
      - name: Bind and stage the no-integration OFF export
        run: node scripts/ci/artifacts.ts pack-off out .ci-off-artifact
        id: package
        env:
          CI_CANDIDATE_SHA: ${{ needs.prepare.outputs.source_sha }}
      - name: Upload bounded verification evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: off-export-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-off-artifact/
          retention-days: 3
          if-no-files-found: error
          include-hidden-files: true
    needs:
      - prepare
    outputs:
      source_sha: ${{ steps.package.outputs.source_sha }}
      manifest_sha256: ${{ steps.package.outputs.manifest_sha256 }}
  browser:
    name: Nightly browser tests (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs:
      - quality
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            shards: 8
          - shard: 2
            shards: 8
          - shard: 3
            shards: 8
          - shard: 4
            shards: 8
          - shard: 5
            shards: 8
          - shard: 6
            shards: 8
          - shard: 7
            shards: 8
          - shard: 8
            shards: 8
      max-parallel: 4
    env:
      SHARD: ${{ matrix.shard }}
      SHARDS: '8'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup
      - name: Install the unchanged Nightly browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Download the same-run OFF export into quarantine
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: off-export-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-off-artifact
      - name: Validate complete OFF payload before creating out
        run: node scripts/ci/artifacts.ts unpack-off out .ci-off-artifact
        env:
          CI_CANDIDATE_SHA: ${{ needs.quality.outputs.source_sha }}
          CI_MANIFEST_SHA256: ${{ needs.quality.outputs.manifest_sha256 }}
      - name: Verify exported edge rules
        run: cmp out/.htaccess docs/generated/htaccess.txt
      - name: Verify the full 14-project configuration has eight disjoint complete test shards
        env:
          PW_SET: nightly
        run: |-
          set -euo pipefail
          mkdir -p nightly-evidence
          npx playwright test --list --reporter=json > nightly-evidence/full.json
          for part in 1 2 3 4 5 6 7 8; do
            npx playwright test --shard="$part/8" --list --reporter=json > "nightly-evidence/shard-$part.json"
          done
          node scripts/ci/inventories.ts verify nightly nightly-evidence/full.json nightly-evidence/inventory-receipt.json nightly-evidence/shard-{1,2,3,4,5,6,7,8}.json
      - name: Playwright (PW_SET=nightly, unchanged projects and limits)
        env:
          PW_SET: nightly
          PLAYWRIGHT_JSON_OUTPUT_NAME: nightly-evidence/results.json
        run: |-
          set -euo pipefail
          npx playwright test --shard="$SHARD/8" --reporter=github,html,json 2>&1 | tee nightly-evidence/run.log
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: playwright-report-nightly-${{ matrix.shard }}-of-8
          path: |
            playwright-report
            test-results
            nightly-evidence
          retention-days: 14
  visual:
    name: Nightly visual checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs:
      - quality
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup
        with:
          browser: chromium
      - name: Download the same-run OFF export into quarantine
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: off-export-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-off-artifact
      - name: Validate complete OFF payload before creating out
        run: node scripts/ci/artifacts.ts unpack-off out .ci-off-artifact
        env:
          CI_CANDIDATE_SHA: ${{ needs.quality.outputs.source_sha }}
          CI_MANIFEST_SHA256: ${{ needs.quality.outputs.manifest_sha256 }}
      - name: Verify exported edge rules
        run: cmp out/.htaccess docs/generated/htaccess.txt
      - name: Compare with baselines
        if: ${{ !inputs.update_snapshots }}
        run: npm run test:e2e:visual
      - name: Regenerate baselines
        if: ${{ inputs.update_snapshots }}
        run: npm run test:e2e:visual -- --update-snapshots
      - name: Upload snapshots and report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: visual-results
          path: |
            tests/e2e/__screenshots__
            playwright-report
          retention-days: 14
          if-no-files-found: ignore
      - name: Identify comparison versus explicit manual regeneration
        run: |-
          if [ "$UPDATE_SNAPSHOTS" = true ]; then
            echo "Manual regeneration mode: this run is NOT baseline-comparison acceptance." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Existing baselines compared; no regeneration requested." >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          UPDATE_SNAPSHOTS: ${{ inputs.update_snapshots }}
        if: always()
  links:
    name: Nightly link checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    needs:
      - quality
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup
      - name: Download the same-run OFF export into quarantine
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: off-export-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-off-artifact
      - name: Validate complete OFF payload before creating out
        run: node scripts/ci/artifacts.ts unpack-off out .ci-off-artifact
        env:
          CI_CANDIDATE_SHA: ${{ needs.quality.outputs.source_sha }}
          CI_MANIFEST_SHA256: ${{ needs.quality.outputs.manifest_sha256 }}
      - name: Verify exported edge rules
        run: cmp out/.htaccess docs/generated/htaccess.txt
      - name: Link check
        run: node scripts/check-links.ts
  bundle:
    name: Nightly bundle checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs:
      - quality
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup
      - name: Download the same-run OFF export into quarantine
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: off-export-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-off-artifact
      - name: Validate complete OFF payload before creating out
        run: node scripts/ci/artifacts.ts unpack-off out .ci-off-artifact
        env:
          CI_CANDIDATE_SHA: ${{ needs.quality.outputs.source_sha }}
          CI_MANIFEST_SHA256: ${{ needs.quality.outputs.manifest_sha256 }}
      - name: Verify exported edge rules
        run: cmp out/.htaccess docs/generated/htaccess.txt
      - name: Lighthouse (5 runs, mobile emulation)
        run: npx lhci autorun --collect.numberOfRuns=5
      - name: Summary
        if: always()
        run: node scripts/lhci-summary.ts >> "$GITHUB_STEP_SUMMARY"
      - name: Bind fresh public metadata for the separate analyzer rebuild
        run: node scripts/build-info.ts
      - name: Bundle analysis
        run: npm run analyze
      - name: Verify analyzer output is still default-OFF
        run: npm run check:assistant-disabled
      - name: Record the separate analyzer rebuild identity and file manifest
        run: node scripts/ci/artifacts.ts pack-off out .ci-analyzer-artifact
      - name: Upload Lighthouse and bundle reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: quality-reports
          include-hidden-files: true
          path: |
            .lighthouseci
            .next/analyze
            .ci-analyzer-artifact/manifest.json
          retention-days: 30
          if-no-files-found: ignore
  checks:
    name: Nightly required checks
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    needs:
      - prepare
      - quality
      - browser
      - visual
      - links
      - bundle
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Node for the dependency-free CI helpers
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - name: Require successful complete job evidence
        run: node scripts/ci/acceptance.ts nightly
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
      - name: Record the visual acceptance mode
        run: |-
          if [ "$UPDATE_SNAPSHOTS" = true ]; then
            echo "All jobs succeeded in explicit regeneration mode; not a baseline-comparison approval." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "All Nightly jobs succeeded with existing baseline comparison." >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          UPDATE_SNAPSHOTS: ${{ inputs.update_snapshots }}
