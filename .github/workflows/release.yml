name: Release

# Tags and publishes a release when package.json's version has a CHANGELOG section (ADR-0018,
# OD-78; pattern of engineering-standards ADR 0003). A version-bump PR on `develop` sets
# package.json `version` and moves the `## [Unreleased]` entries under `## [X.Y.Z] - date`; the
# develop -> main release PR then reaches `main`, where this workflow creates the tag `vX.Y.Z` on
# the merge commit and a GitHub Release (immutable releases and the `v*` tag ruleset are enabled
# on the repository) with that section. It skips when a published release exists and fails on a draft,
# a tag without a release, or a version with neither a section nor a published release. Pushes to `main` are production deploys by Hostinger
# itself; this workflow neither builds nor deploys and is independent of the manual `Deploy`
# workflow (deploy.yml, which takes an existing tag as input). First real run: M7 promotion.
"on":
  push:
    branches:
      - main
permissions: {}
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    name: Tag and release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node (dependency-free: no install step)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Read version and release notes
        id: notes
        run: node tools/release-notes.ts --out "$RUNNER_TEMP/notes.md" >> "$GITHUB_OUTPUT"
      - name: Fail when the version has no CHANGELOG section and no release
        if: steps.notes.outputs.has_section != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.notes.outputs.version }}
        run: |
          state=$(gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" --json isDraft \
            --jq 'if .isDraft then "draft" else "published" end' 2> /dev/null || echo none)
          if [ "$state" = published ]; then
            exit 0
          fi
          echo "::error title=release::version ${VERSION} has no CHANGELOG section and no published release (${state})"
          exit 1
      - name: Create the tag and the release
        if: steps.notes.outputs.has_section == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.notes.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          tag="v${VERSION}"
          state=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft \
            --jq 'if .isDraft then "draft" else "published" end' 2> /dev/null || echo none)
          case "$state" in
            published)
              echo "release $tag already exists; nothing to do"
              exit 0
              ;;
            draft)
              # v1.0.0 has only a draft: never publish or re-target it silently.
              echo "::error title=release::release $tag is a draft; publish it by hand or bump package.json version"
              exit 1
              ;;
          esac
          # A tag without any release (a partial earlier run or a manual tag) is never re-targeted.
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" > /dev/null 2>&1; then
            echo "::error title=release::tag $tag exists without a release; create the release for that tag by hand or bump the version"
            exit 1
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$SHA" --title "$tag" \
            --notes-file "$RUNNER_TEMP/notes.md" --latest
          echo "created $tag at $SHA"
