name: Release PR

# release-please in manifest mode against develop (ecosystem E5, docs/master-plan/ci-cd.md section
# 6): it keeps ONE release PR that bumps package.json and CHANGELOG.md. Tags and GitHub Releases are
# not created here (`skip-github-release`): the tag `vX.Y.Z` and the immutable release are cut on
# main at promotion (M7, `docs/deployment.md`). Disabled until the owner grants a token whose PRs
# trigger CI (a GitHub App or fine-grained PAT stored as RELEASE_PLEASE_TOKEN) and sets the
# repository variable RELEASE_PLEASE_ENABLED=true (owner-only, ecosystem 15.4).
on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-pr:
    name: Release PR
    if: vars.RELEASE_PLEASE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # writes go through the owner-granted token, not GITHUB_TOKEN
    steps:
      - name: Open or update the release PR
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: develop
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
