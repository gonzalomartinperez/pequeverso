name: Branch policy

# Validates branch naming and PR title for pull requests into main. pull_request_target is used on
# purpose so the policy comes from main and cannot be edited away by the PR itself; the job has no
# permissions, checks out nothing and runs nothing from the head, so no untrusted code executes.
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] no checkout, no permissions, no untrusted code
    types: [opened, edited, synchronize, reopened]

permissions: {}

# Never cancel: a cancelled run leaves a cancelled "Branch policy" check on the head commit, which
# blocks the required-check gate (seen on Dependabot rebases, PR #29). The job takes ~3 s.
concurrency:
  group: branch-policy-${{ github.event.pull_request.number }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  branch-policy:
    name: Branch policy
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Validate head branch and base
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          echo "PR: $HEAD_REPO:$HEAD_REF -> $BASE_REPO:$BASE_REF"
          if [ "$BASE_REF" != "main" ]; then
            echo "::error::Pull requests must target main"; exit 1
          fi
          if [ "$HEAD_REPO" = "$BASE_REPO" ] && ! printf '%s' "$HEAD_REF" | grep -Eq '^(feat|fix|chore|docs|refactor|perf|test|ci|build|revert|release|dependabot)/[a-z0-9]+([._/-][a-z0-9]+)*$'; then
            echo "::error::Branch name must match type/kebab-case (feat|fix|chore|docs|refactor|perf|test|ci|build|revert|release)"; exit 1
          fi
          if ! printf '%s' "$PR_TITLE" | grep -Eq '^(feat|fix|chore|docs|refactor|perf|test|ci|build|revert)(\([a-z0-9-]+\))?!?: .+'; then
            echo "::error::PR title must follow Conventional Commits (e.g. 'feat: add homepage hero')"; exit 1
          fi
          echo "Branch policy satisfied"
