name: Post-deploy verify

# Hostinger builds `main` on push. This workflow waits for that build to reach production,
# then verifies the deployed revision and runs the smoke suite against the live origin.
# deploy.yml reuses it through workflow_call after publishing a release.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit expected in production (empty = the commit this run was started from)
        required: false
        default: ""
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
      site_url:
        required: false
        type: string
        default: https://pequeverso.com

permissions: {}

concurrency:
  # A newer push to main supersedes the wait for an older one; deploy-triggered runs are never cancelled.
  group: post-deploy-verify-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  verify:
    name: Verify production revision
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      SITE_URL: ${{ inputs.site_url || 'https://pequeverso.com' }}
      EXPECTED_SHA: ${{ inputs.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup
        with:
          browser: chromium
      - name: Wait for Hostinger to serve the expected revision
        run: node scripts/wait-for-revision.mjs "$SITE_URL" "$EXPECTED_SHA" 1200
      - name: Smoke
        run: node scripts/smoke.mjs "$SITE_URL" "$EXPECTED_SHA"
      - name: Headers
        run: |
          set -euo pipefail
          headers=$(curl -sI "$SITE_URL/" | grep -iE 'strict-transport|x-content-type|content-security|cache-control|cf-cache-status')
          echo "$headers"
          {
            echo "## Headers ($SITE_URL/)"
            echo
            echo '```'
            echo "$headers"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Playwright (PW_SET=prod)
        env:
          E2E_BASE_URL: ${{ env.SITE_URL }}
        run: npm run test:e2e:prod
      - name: Lighthouse (informative)
        continue-on-error: true
        run: |
          npx lhci collect --url="$SITE_URL/" --url="$SITE_URL/grafismo-fonetico/" --numberOfRuns=1 --settings.preset=desktop --settings.formFactor=mobile --settings.screenEmulation.mobile=true --settings.screenEmulation.width=390 --settings.screenEmulation.height=844 --settings.screenEmulation.deviceScaleFactor=3 --settings.throttlingMethod=simulate
          node scripts/lhci-summary.mjs >> "$GITHUB_STEP_SUMMARY"
