name: Post-deploy verify

# Hostinger builds `main` on push. This workflow waits for that build to reach production,
# then verifies the deployed revision and runs the smoke suite against the live origin.
# deploy.yml (after a release) and production-daily.yml reuse it through workflow_call.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit expected in production (empty = the commit this run was started from)
        required: false
        default: ""
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
      site_url:
        required: false
        type: string
        default: https://pequeverso.com
      wait_seconds:
        description: How long to wait for the revision (production-daily passes a short value; the sha is already live)
        required: false
        type: number
        default: 1200

permissions: {}

concurrency:
  # A newer push to main supersedes the wait for an older one; deploy-triggered runs are never cancelled.
  group: post-deploy-verify-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  verify:
    name: Verify production revision
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      SITE_URL: ${{ inputs.site_url || 'https://pequeverso.com' }}
      EXPECTED_SHA: ${{ inputs.sha || github.sha }}
      WAIT_SECONDS: ${{ inputs.wait_seconds || 1200 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup
        with:
          browser: chromium
      - name: Wait for Hostinger to serve the expected revision
        run: node scripts/wait-for-revision.mjs "$SITE_URL" "$EXPECTED_SHA" "$WAIT_SECONDS"
      - name: Smoke
        run: node scripts/smoke.mjs "$SITE_URL" "$EXPECTED_SHA"
      - name: Headers
        run: |
          set -euo pipefail
          headers=$(curl -sI "$SITE_URL/" | grep -iE 'strict-transport|x-content-type|content-security|cache-control|cf-cache-status')
          echo "$headers"
          {
            echo "## Headers ($SITE_URL/)"
            echo
            echo '```'
            echo "$headers"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Playwright (PW_SET=prod)
        env:
          E2E_BASE_URL: ${{ env.SITE_URL }}
        run: npm run test:e2e:prod
      - name: Lighthouse (informative)
        # --no-lighthouserc: lighthouserc.json starts the local static server, which has no out/ here.
        continue-on-error: true
        run: |
          npx lhci collect --no-lighthouserc --url="$SITE_URL/" --url="$SITE_URL/grafismo-fonetico/" --numberOfRuns=1 --settings.preset=desktop --settings.formFactor=mobile --settings.screenEmulation.mobile=true --settings.screenEmulation.width=390 --settings.screenEmulation.height=844 --settings.screenEmulation.deviceScaleFactor=3 --settings.throttlingMethod=simulate
          node scripts/lhci-summary.mjs >> "$GITHUB_STEP_SUMMARY"
