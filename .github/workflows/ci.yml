name: CI

# Pull requests: build + E2E + Lighthouse. Pushes to main: build only (Hostinger builds main;
# post-deploy-verify.yml checks production). The required status check is the `ci` job.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  # Supersede an older run of the same pull request; never cancel a push to main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Business values are required at build time (scripts/check-env.mjs); CI builds use the public
  # origin and a fake Hotmart offer code (tests assert only the pay.hotmart.com origin and checkoutMode=10).
  NEXT_PUBLIC_SITE_URL: https://pequeverso.com
  NEXT_PUBLIC_CHECKOUT_URL_GRAFISMO_FONETICO: https://pay.hotmart.com/TEST0000000?checkoutMode=10
  # Fake pixel id so the consent-gated path is exercised by E2E without contacting third parties.
  NEXT_PUBLIC_META_PIXEL_ID: "1234567890123456"
  E2E_EXPECT_CONSENT: "1"

jobs:
  workflows:
    name: Lint workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: 1.7.12
          pyflakes: false
      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          advanced-security: false
          annotations: true
          min-severity: low

  build:
    name: Build (lint, types, unit, knip, export, budgets)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup
      - name: Lint
        run: npx biome ci --error-on-warnings --reporter=github .
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Dead code (production)
        run: npm run knip:production
      - name: Restore Next.js cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - name: Build static export
        run: npm run build
      - name: Build leaves the tree clean (generated files are committed)
        run: git diff --exit-code
      - name: Media budget
        run: npm run check:media
      - name: Placeholders (report)
        run: npm run check:placeholders
      - name: Bundle budget
        run: npm run check:bundle
      - name: Rendered HTML invariants
        run: npm run check:rendered
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Upload export
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-export
          path: out
          retention-days: 3
          if-no-files-found: error

  hostinger:
    # Proves the Hostinger Node.js Web App build environment, which the Ubuntu job cannot: GLIBC 2.28
    # (native SWC/Turbopack bindings do not load; Next must fall back to WASM), `next build --webpack`,
    # the standalone target and `npm start` serving redirects/headers from config/edge-rules.json.
    # Origin: PR #5 (86a4bab) — the host build failed although CI was green.
    name: Hostinger parity (GLIBC 2.28, standalone)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    container:
      image: rockylinux:8@sha256:2d05a9266523bbf24f33ebc3a9832e4d5fd74b973c220f2204ca802286aa275d
    defaults:
      run:
        shell: bash
    steps:
      - name: Install container prerequisites
        run: dnf install -y -q git tar gzip xz
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Assert the host baseline (glibc 2.28)
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.28"
          echo "$(getconf GNU_LIBC_VERSION), node $(node --version), npm $(npm --version)"
      - name: Install dependencies
        run: npm ci
      - name: Assert Next falls back to the WASM SWC bindings
        run: |
          node -e 'require("next/dist/build/swc").loadBindings().then((b) => { if (!b.isWasm) throw new Error("expected the WASM SWC bindings on glibc 2.28"); console.log("swc: wasm bindings loaded"); })'
      - name: Build standalone (webpack, WASM SWC)
        run: npm run build:standalone
      - name: Smoke the standalone server
        run: |
          set -euo pipefail
          PORT=3000 npm start > standalone.log 2>&1 &
          node -e 'const until=Date.now()+30000;(async()=>{while(Date.now()<until){try{if((await fetch("http://localhost:3000/")).ok)process.exit(0)}catch{}await new Promise(r=>setTimeout(r,1000))}console.error("standalone server did not start");process.exit(1)})()'
          node scripts/smoke.mjs http://localhost:3000 "$GITHUB_SHA"
          kill %1
      - name: Server log
        if: failure()
        run: cat standalone.log || true
      - name: Build leaves the tree clean
        run: git diff --exit-code

  e2e:
    name: E2E (chromium 390/768/1440 + reduced motion)
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: build
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup
        with:
          browser: chromium
      - name: Download export
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-export
          path: out
      - name: Playwright (PW_SET=pr)
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  lighthouse:
    name: Lighthouse CI
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: build
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup
      - name: Download export
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-export
          path: out
      - name: Lighthouse (2 runs, mobile emulation)
        run: npx lhci autorun
      - name: Summary
        if: always()
        run: node scripts/lhci-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse
          path: .lighthouseci
          retention-days: 30
          if-no-files-found: warn

  ci:
    # Required status check (branch ruleset). Passes when every gate passed or was legitimately skipped.
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    needs: [workflows, build, hostinger, e2e, lighthouse]
    if: always()
    steps:
      - name: Evaluate gates
        env:
          WORKFLOWS: ${{ needs.workflows.result }}
          BUILD: ${{ needs.build.result }}
          HOSTINGER: ${{ needs.hostinger.result }}
          E2E: ${{ needs.e2e.result }}
          LIGHTHOUSE: ${{ needs.lighthouse.result }}
        run: |
          set -euo pipefail
          echo "workflows=$WORKFLOWS build=$BUILD hostinger=$HOSTINGER e2e=$E2E lighthouse=$LIGHTHOUSE"
          test "$WORKFLOWS" = success
          test "$BUILD" = success
          test "$HOSTINGER" = success
          case "$E2E" in success|skipped) ;; *) exit 1 ;; esac
          case "$LIGHTHOUSE" in success|skipped) ;; *) exit 1 ;; esac
