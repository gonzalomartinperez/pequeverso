# Validation only. CI profiles (ecosystem 6.0, docs/reference/ci-profile.md): `classify` (engineering-standards
# reusable workflow) maps the changed files, branch and labels in .github/ci-profile.json to the jobs
# to run; every other job is gated on that list, and `ci-gate` is the single fail-closed required
# check. `ci` is a temporary alias of `ci-gate` kept until the rulesets require `ci-gate` only.
name: CI
"on":
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch: null
permissions: {}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_SITE_URL: https://pequeverso.com
  NEXT_PUBLIC_CHECKOUT_URL_GRAFISMO_FONETICO: https://pay.hotmart.com/TEST0000000?checkoutMode=10
  NEXT_PUBLIC_META_PIXEL_ID: "1234567890123456"
  E2E_EXPECT_CONSENT: "1"
  NEXT_PUBLIC_ASSISTANT_ENABLED: "false"
  NEXT_PUBLIC_ASSISTANT_API_ORIGIN: ""
  NEXT_PUBLIC_DESIGN_GALLERY: ""
  NEXT_OUTPUT: export
jobs:
  classify:
    uses: gonzalomartinperez/engineering-standards/.github/workflows/classify.yml@1f33be46bcb95f42f550f74608bc679cae5575ad # v1.0.0
    permissions:
      contents: read
      pull-requests: read
  workflows:
    name: Workflow validation
    needs: classify
    if: contains(fromJSON(needs.classify.outputs.jobs), 'workflows')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7
        with:
          version: 1.7.12
          pyflakes: false
      - name: zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.30.1
          advanced-security: false
          annotations: true
          min-severity: low
  secrets:
    name: Secret scan
    needs: classify
    if: contains(fromJSON(needs.classify.outputs.jobs), 'secrets')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks over the full history (redacted; fails on zero commits scanned)
        run: .github/scripts/secret-scan.sh
  docs:
    name: Docs and harness checks
    needs: classify
    if: contains(fromJSON(needs.classify.outputs.jobs), 'docs')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Node (dependency-free checks, no npm ci)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - name: Skills catalog and its tests
        run: node tools/check-skills.ts && node --test tests/unit/skills.test.ts
      - name: Repository-wide content guards (retired domain, security.txt, README headings, ADR index)
        run: |
          set -euo pipefail
          guards=(tests/unit/old-domain.test.ts tests/unit/security-txt.test.ts tests/unit/readme.test.ts tests/unit/adr-index.test.ts)
          for guard in "${guards[@]}"; do test -f "$guard" || { echo "::error::missing $guard"; exit 1; }; done
          node --test "${guards[@]}"
  quality:
    name: Quality checks
    needs: classify
    if: contains(fromJSON(needs.classify.outputs.jobs), 'quality')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup
      - name: Lint
        run: npx biome ci --error-on-warnings --reporter=github .
      - name: Typecheck
        run: npm run typecheck
      - name: Typecheck tools/media (own package; binaries not downloaded)
        run: |
          npm ci --prefix tools/media --ignore-scripts --no-audit --no-fund
          npm run typecheck:media
      - name: Unit tests and architecture contracts (including negative fixtures)
        run: npm test
      - name: Dead code (production and full, as the nightly runs it)
        run: npm run knip:production && npm run knip
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Validate focused agent workflows
        run: npm run check:skills
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    needs:
      - classify
      - quality
    if: contains(fromJSON(needs.classify.outputs.jobs), 'build')
    outputs:
      source_sha: ${{ steps.package.outputs.source_sha }}
      manifest_sha256: ${{ steps.package.outputs.manifest_sha256 }}
      browser_matrix: ${{ steps.matrix.outputs.browser_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup
      - name: Restore Next.js cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - name: Build static export
        run: npm run build
      - name: Build leaves the tree clean (generated files are committed)
        run: git diff --exit-code
      - name: Media budget
        run: npm run check:media
      - name: Placeholders (report)
        run: npm run check:placeholders
      - name: Bundle budget
        run: npm run check:bundle
      - name: Deferred 3D scene budget
        run: npm run check:scene
      - name: Rendered HTML invariants
        run: npm run check:rendered
      - name: Assistant absent from the export (no launcher, chunk or API origin)
        run: npm run check:assistant-disabled && npm run check:site-analytics-disabled
      - name: State gallery absent from the export (no /_design route, chunk or marker)
        run: npm run check:design-gallery-disabled
      - name: Bind and stage the OFF-only export
        run: node tools/ci/artifacts.ts pack-off out .ci-off-artifact
        id: package
      - name: Publish the fixed complete browser matrix
        run: |-
          matrix=$(node tools/ci/inventories.ts matrix core)
          echo "browser_matrix=$matrix" >> "$GITHUB_OUTPUT"
        id: matrix
      - name: Upload bounded verification evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: off-export-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-off-artifact/
          retention-days: 3
          if-no-files-found: error
          include-hidden-files: true
  hosting:
    name: Hosting contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    container:
      image: rockylinux:8@sha256:2d05a9266523bbf24f33ebc3a9832e4d5fd74b973c220f2204ca802286aa275d
    defaults:
      run:
        shell: bash
    steps:
      - name: Install container prerequisites
        run: dnf install -y -q git tar gzip xz
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Assert the host baseline (glibc 2.28)
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.28"
          echo "$(getconf GNU_LIBC_VERSION), node $(node --version), npm $(npm --version)"
      - name: Install dependencies
        run: npm ci
      - name: Assert Next falls back to the WASM SWC bindings
        run: |
          node -e 'require("next/dist/build/swc").loadBindings().then((b) => { if (!b.isWasm) throw new Error("expected the WASM SWC bindings on glibc 2.28"); console.log("swc: wasm bindings loaded"); })'
      - name: Build standalone (webpack, WASM SWC)
        run: npm run build:standalone
      - name: Smoke the standalone server
        run: |
          set -euo pipefail
          # Docker exports HOSTNAME=<container id>, which tools/start.ts honours (as the host does).
          HOSTNAME=127.0.0.1 PORT=3000 npm start > standalone.log 2>&1 &
          node -e 'const until=Date.now()+30000;(async()=>{while(Date.now()<until){try{if((await fetch("http://localhost:3000/")).ok)process.exit(0)}catch{}await new Promise(r=>setTimeout(r,1000))}console.error("standalone server did not start");process.exit(1)})()'
          node tools/smoke.ts http://localhost:3000 "$GITHUB_SHA"
          kill %1
      - name: Server log
        if: failure()
        run: cat standalone.log || true
      - name: Build leaves the tree clean
        run: git diff --exit-code
    needs:
      - classify
      - quality
    if: contains(fromJSON(needs.classify.outputs.jobs), 'hosting')
  browser:
    name: Browser tests (${{ matrix.index }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    needs:
      - classify
      - build
    if: contains(fromJSON(needs.classify.outputs.jobs), 'browser')
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.build.outputs.browser_matrix) }}
    env:
      SUITE: ${{ matrix.suite }}
      SHARD: ${{ matrix.shard }}
      SHARDS: "4"
      AI_PROVIDER: fixture
      ALLOW_PAID_AI: "false"
      OPENAI_API_KEY: ""
      CI_CANDIDATE_SHA: ${{ needs.build.outputs.source_sha }}
      PLAYWRIGHT_JSON_OUTPUT_NAME: .ci-evidence/results.json
      PLAYWRIGHT_HTML_OUTPUT_DIR: ${{ matrix.suite == 'native' && 'playwright-report-assistant' || 'playwright-report' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup
      - name: Install the unchanged three-engine browser catalogue
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Download the same-run OFF export into quarantine
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: off-export-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-off-artifact
        if: matrix.suite == 'functional'
      - name: Validate complete OFF payload before creating out
        run: node tools/ci/artifacts.ts unpack-off out .ci-off-artifact
        env:
          CI_CANDIDATE_SHA: ${{ needs.build.outputs.source_sha }}
          CI_MANIFEST_SHA256: ${{ needs.build.outputs.manifest_sha256 }}
        if: matrix.suite == 'functional'
      - name: Verify exported edge rules
        run: cmp out/.htaccess docs/generated/htaccess.txt
        if: matrix.suite == 'functional'
      - name: Require the pinned native fixture contract
        run: |-
          set -euo pipefail
          node -e 'if (!require("./package.json").scripts["test:browser:assistant"]) process.exit(1)'
          revision="$(tr -d '[:space:]' < tests/assistant/api-revision)"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid pinned API revision" >&2; exit 1; }
          echo "api_revision=$revision" >> "$GITHUB_OUTPUT"
        id: suite
        if: matrix.suite == 'native'
      - name: Checkout the pinned assistant API (public repository, committed revision)
        if: matrix.suite == 'native'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: gonzalomartinperez/pequeverso-assistant-api
          ref: ${{ steps.suite.outputs.api_revision }}
          path: .assistant-api
          persist-credentials: false
      - name: Setup uv
        if: matrix.suite == 'native'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.1
          enable-cache: true
          cache-dependency-glob: .assistant-api/uv.lock
      - name: Install the API (frozen lockfile)
        if: matrix.suite == 'native'
        run: uv sync --frozen --directory .assistant-api
      - name: Prove every test belongs to the exact complete configuration partition
        run: |-
          set -euo pipefail
          mkdir -p .ci-evidence
          case "$SUITE" in
            functional) config=(--config=playwright.config.ts); export PW_SET=pr ;;
            native) config=(--config=playwright.assistant.config.ts) ;;
            *) echo "Unknown browser configuration" >&2; exit 1 ;;
          esac
          env -u PLAYWRIGHT_JSON_OUTPUT_NAME npx playwright test "${config[@]}" --list --reporter=json > .ci-evidence/full.json
          for part in 1 2 3 4; do
            env -u PLAYWRIGHT_JSON_OUTPUT_NAME npx playwright test "${config[@]}" --shard="$part/4" --list --reporter=json > ".ci-evidence/shard-$part.json"
          done
          node tools/ci/inventories.ts verify "$SUITE" .ci-evidence/full.json .ci-evidence/inventory-receipt.json .ci-evidence/shard-{1,2,3,4}.json
        env:
          ASSISTANT_API_DIR: ${{ github.workspace }}/.assistant-api
      - name: Build the unpublishable native fixture at this exact candidate
        run: npm run build:assistant-fixture
        if: matrix.suite == 'native'
      - name: Record the native build identity without packaging its export
        run: node tools/ci/artifacts.ts attest-native out-assistant-fixture .ci-evidence/native-build-identity.json
        if: matrix.suite == 'native'
        env:
          NEXT_PUBLIC_ASSISTANT_ENABLED: "true"
          NEXT_PUBLIC_ASSISTANT_API_ORIGIN: https://127.0.0.1:8217
          NEXT_PUBLIC_META_PIXEL_ID: "1234567890123456"
      - name: Run the unchanged functional or native assertions
        run: |-
          set -euo pipefail
          case "$SUITE" in
            functional) export PW_SET=pr; config=(--config=playwright.config.ts) ;;
            native) config=(--config=playwright.assistant.config.ts) ;;
            *) echo "Unknown browser configuration" >&2; exit 1 ;;
          esac
          npx playwright test "${config[@]}" --shard="$SHARD/4" --reporter=list,html,json 2>&1 | tee .ci-evidence/run.log
        env:
          ASSISTANT_API_DIR: ${{ github.workspace }}/.assistant-api
      - name: Upload bounded verification evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verification-${{ matrix.suite }}-${{ matrix.shard }}-of-4
          path: |-
            playwright-report/
            playwright-report-assistant/
            test-results/
            test-results-assistant/
            .ci-evidence/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
        if: always()
  performance:
    name: Performance checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs:
      - classify
      - build
    if: contains(fromJSON(needs.classify.outputs.jobs), 'performance')
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup
      - name: Download the same-run OFF export into quarantine
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: off-export-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-off-artifact
      - name: Validate complete OFF payload before creating out
        run: node tools/ci/artifacts.ts unpack-off out .ci-off-artifact
        env:
          CI_CANDIDATE_SHA: ${{ needs.build.outputs.source_sha }}
          CI_MANIFEST_SHA256: ${{ needs.build.outputs.manifest_sha256 }}
      - name: Verify exported edge rules
        run: cmp out/.htaccess docs/generated/htaccess.txt
      - name: Lighthouse (3 runs, mobile emulation, production-config export)
        run: npx lhci autorun
      - name: Lighthouse ratchet (median of 3 per route, error level)
        if: always()
        run: node tools/lhci-assert.ts ratchets/lighthouse-lab.json
      - name: Summary
        if: always()
        run: node tools/lhci-summary.ts >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: lighthouse
          path: .lighthouseci
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn
  ci-gate:
    name: ci-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions: {}
    needs:
      - classify
      - workflows
      - secrets
      - docs
      - quality
      - build
      - hosting
      - browser
      - performance
    if: always()
    steps:
      # Fail closed: a failed or cancelled job fails the gate; a job classify selected must succeed
      # (a skip there means a broken `if:`); unselected jobs may be skipped. classify must succeed.
      - name: Aggregate job results
        uses: gonzalomartinperez/engineering-standards/actions/ci-gate@1f33be46bcb95f42f550f74608bc679cae5575ad # v1.0.0
        with:
          needs: ${{ toJSON(needs) }}
          expected: ${{ needs.classify.outputs.jobs || '[]' }}
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    needs:
      - ci-gate
    if: always()
    steps:
      - name: Temporary alias of ci-gate (removed once the rulesets require ci-gate only)
        env:
          GATE: ${{ needs.ci-gate.result }}
        run: |
          echo "ci-gate: $GATE"
          test "$GATE" = success
