name: CI

# Pull requests: build + E2E + Lighthouse. Pushes to main: build only (Hostinger builds main;
# post-deploy-verify.yml checks production). The required status check is the `ci` job.
on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  # Supersede an older run of the same pull request; never cancel a push to main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Business values are required at build time (scripts/check-env.ts); CI builds use the public
  # origin and a fake Hotmart offer code (tests assert only the pay.hotmart.com origin and checkoutMode=10).
  NEXT_PUBLIC_SITE_URL: https://pequeverso.com
  NEXT_PUBLIC_CHECKOUT_URL_GRAFISMO_FONETICO: https://pay.hotmart.com/TEST0000000?checkoutMode=10
  # Fake pixel id so the consent-gated path is exercised by E2E without contacting third parties.
  NEXT_PUBLIC_META_PIXEL_ID: "1234567890123456"
  E2E_EXPECT_CONSENT: "1"
  # The shopping assistant ships disabled. Every build here (and the artifact other jobs reuse)
  # is the disabled site; only the `assistant` job builds an enabled copy, which is never uploaded.
  NEXT_PUBLIC_ASSISTANT_ENABLED: "false"
  NEXT_PUBLIC_ASSISTANT_API_ORIGIN: ""

jobs:
  workflows:
    name: Lint workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: 1.7.12
          pyflakes: false
      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          advanced-security: false
          annotations: true
          min-severity: low

  secrets:
    name: Secret scan (history)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks over the full history (redacted; fails on zero commits scanned)
        run: .github/scripts/secret-scan.sh

  build:
    name: Build (lint, types, unit, knip, export, budgets)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup
      - name: Lint
        run: npx biome ci --error-on-warnings --reporter=github .
      - name: Typecheck
        run: npm run typecheck
      - name: Typecheck tools/media (own package; binaries not downloaded)
        run: |
          npm ci --prefix tools/media --ignore-scripts --no-audit --no-fund
          npm run typecheck:media
      - name: Unit tests
        run: npm test
      - name: Dead code (production)
        run: npm run knip:production
      - name: Restore Next.js cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - name: Build static export
        run: npm run build
      - name: Build leaves the tree clean (generated files are committed)
        run: git diff --exit-code
      - name: Media budget
        run: npm run check:media
      - name: Placeholders (report)
        run: npm run check:placeholders
      - name: Bundle budget
        run: npm run check:bundle
      - name: Deferred 3D scene budget
        run: npm run check:scene
      - name: Rendered HTML invariants
        run: npm run check:rendered
      - name: Assistant absent from the export (no launcher, chunk or API origin)
        run: npm run --if-present check:assistant-disabled
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Upload export
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-export
          path: out
          retention-days: 3
          if-no-files-found: error

  hostinger:
    # Proves the Hostinger Node.js Web App build environment, which the Ubuntu job cannot: GLIBC 2.28
    # (native SWC/Turbopack bindings do not load; Next must fall back to WASM), `next build --webpack`,
    # the standalone target and `npm start` serving redirects/headers from config/edge-rules.json.
    # Origin: PR #5 (86a4bab) — the host build failed although CI was green.
    name: Hostinger parity (GLIBC 2.28, standalone)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    container:
      image: rockylinux:8@sha256:2d05a9266523bbf24f33ebc3a9832e4d5fd74b973c220f2204ca802286aa275d
    defaults:
      run:
        shell: bash
    steps:
      - name: Install container prerequisites
        run: dnf install -y -q git tar gzip xz
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Assert the host baseline (glibc 2.28)
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.28"
          echo "$(getconf GNU_LIBC_VERSION), node $(node --version), npm $(npm --version)"
      - name: Install dependencies
        run: npm ci
      - name: Assert Next falls back to the WASM SWC bindings
        run: |
          node -e 'require("next/dist/build/swc").loadBindings().then((b) => { if (!b.isWasm) throw new Error("expected the WASM SWC bindings on glibc 2.28"); console.log("swc: wasm bindings loaded"); })'
      - name: Build standalone (webpack, WASM SWC)
        run: npm run build:standalone
      - name: Smoke the standalone server
        run: |
          set -euo pipefail
          # Docker exports HOSTNAME=<container id>, which scripts/start.ts honours (as the host does).
          HOSTNAME=127.0.0.1 PORT=3000 npm start > standalone.log 2>&1 &
          node -e 'const until=Date.now()+30000;(async()=>{while(Date.now()<until){try{if((await fetch("http://localhost:3000/")).ok)process.exit(0)}catch{}await new Promise(r=>setTimeout(r,1000))}console.error("standalone server did not start");process.exit(1)})()'
          node scripts/smoke.ts http://localhost:3000 "$GITHUB_SHA"
          kill %1
      - name: Server log
        if: failure()
        run: cat standalone.log || true
      - name: Build leaves the tree clean
        run: git diff --exit-code

  e2e:
    name: E2E (chromium 390/768/1440 + reduced motion, ${{ matrix.shard }}/2)
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: build
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup
        with:
          browser: chromium
      - name: Install text-reflow browsers
        run: npx playwright install --with-deps firefox webkit
      - name: Download export
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-export
          path: out
      - name: Playwright (PW_SET=pr, shard ${{ matrix.shard }}/2)
        run: npm run test:e2e -- --shard="${SHARD}/2"
        env:
          SHARD: ${{ matrix.shard }}
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report
          retention-days: 7

  assistant:
    # Enabled-assistant verification in fixture mode against the real API (no paid model, no
    # credentials). Runs only once the repository defines `test:e2e:assistant` and pins the API in
    # tests/assistant/api-revision. The enabled build stays on this runner: only Playwright reports
    # are uploaded, under a name that marks them as unpublishable.
    name: Assistant (enabled, fixture API)
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      AI_PROVIDER: fixture
      ALLOW_PAID_AI: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect the suite
        id: suite
        run: |
          set -euo pipefail
          if node -e 'process.exit(require("./package.json").scripts?.["test:e2e:assistant"] ? 0 : 1)'; then
            revision="$(tr -d '[:space:]' < tests/assistant/api-revision)"
            [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::tests/assistant/api-revision must hold a full commit sha"; exit 1; }
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "api_revision=$revision" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No test:e2e:assistant script yet; nothing to run." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Checkout the pinned assistant API (public repository, committed revision)
        if: steps.suite.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gonzalomartinperez/pequeverso-assistant-api
          ref: ${{ steps.suite.outputs.api_revision }}
          path: .assistant-api
          persist-credentials: false
      - name: Setup uv
        if: steps.suite.outputs.present == 'true'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.21
          enable-cache: true
          cache-dependency-glob: .assistant-api/uv.lock
      - name: Install the API (frozen lockfile)
        if: steps.suite.outputs.present == 'true'
        run: uv sync --frozen --directory .assistant-api
      - name: Setup
        if: steps.suite.outputs.present == 'true'
        uses: ./.github/actions/setup
      - name: Install Playwright browsers
        if: steps.suite.outputs.present == 'true'
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Enabled build + Playwright against the fixture API
        if: steps.suite.outputs.present == 'true'
        env:
          ASSISTANT_API_DIR: ${{ github.workspace }}/.assistant-api
        run: npm run test:e2e:assistant
      - name: Upload reports (UNPUBLISHABLE, assistant enabled)
        if: always() && steps.suite.outputs.present == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: UNPUBLISHABLE-assistant-enabled-reports
          path: |
            playwright-report-assistant/
            test-results-assistant/
          retention-days: 7
          if-no-files-found: ignore

  lighthouse:
    name: Lighthouse CI
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: build
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup
      - name: Download export
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-export
          path: out
      - name: Lighthouse (2 runs, mobile emulation)
        run: npx lhci autorun
      - name: Summary
        if: always()
        run: node scripts/lhci-summary.ts >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse
          path: .lighthouseci
          retention-days: 30
          if-no-files-found: warn

  ci:
    # Required status check (branch ruleset). Passes when every gate passed or was legitimately skipped.
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    needs: [workflows, secrets, build, hostinger, e2e, assistant, lighthouse]
    if: always()
    permissions: {}
    steps:
      - name: Evaluate gates
        env:
          WORKFLOWS: ${{ needs.workflows.result }}
          SECRETS: ${{ needs.secrets.result }}
          BUILD: ${{ needs.build.result }}
          HOSTINGER: ${{ needs.hostinger.result }}
          E2E: ${{ needs.e2e.result }}
          ASSISTANT: ${{ needs.assistant.result }}
          LIGHTHOUSE: ${{ needs.lighthouse.result }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          echo "workflows=$WORKFLOWS secrets=$SECRETS build=$BUILD hostinger=$HOSTINGER e2e=$E2E assistant=$ASSISTANT lighthouse=$LIGHTHOUSE"
          test "$WORKFLOWS" = success
          test "$SECRETS" = success
          test "$BUILD" = success
          test "$HOSTINGER" = success
          # Browser gates are skipped only on pushes (they ran on the pull request); a pull request
          # must run them.
          if [ "$EVENT" = push ]; then allowed="success skipped"; else allowed="success"; fi
          for result in "$E2E" "$ASSISTANT" "$LIGHTHOUSE"; do
            case " $allowed " in *" $result "*) ;; *) echo "browser gate: $result"; exit 1 ;; esac
          done
