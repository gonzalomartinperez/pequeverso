name: Deploy

# Gated release to Hostinger through Hostinger's Git integrations (no SSH, no secrets):
# 1. build the static export of the requested tag/commit with the environment's variables;
# 2. publish `out/` (with .htaccess and build-info.json) to the `deploy` branch as a
#    single orphan commit — for a Hostinger *website* whose Git deployment pulls that branch
#    into public_html (no build on the host) — and promote the source commit to `release`,
#    the branch a Hostinger *Node.js Web App* builds and runs (standalone, webpack build);
# 3. wait for the host to pick it up and verify the deployed revision over HTTP.
# The `production` environment requires an approval; rollback = re-run with the previous tag.
# See docs/deployment.md.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Tag (vX.Y.Z) or commit to deploy
        required: true
        default: main
      target:
        description: Deployment target
        required: true
        default: production
        type: choice
        options: [production, staging]

permissions:
  contents: write

concurrency:
  group: deploy-${{ inputs.target }}
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  release:
    name: Build, publish deploy branch, verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: ${{ inputs.target }}
      url: ${{ vars.NEXT_PUBLIC_SITE_URL }}
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      site_url: ${{ vars.NEXT_PUBLIC_SITE_URL }}
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Resolve commit
        id: meta
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "branch=${{ inputs.target == 'production' && 'deploy' || 'deploy-staging' }}" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Launch gates — no placeholders, media rights confirmed
        run: |
          npm run check:placeholders:strict
          npm run check:media -- --strict

      - name: Build with environment configuration
        env:
          GITHUB_SHA: ${{ steps.meta.outputs.sha }}
          GITHUB_REF_NAME: ${{ inputs.ref }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_CHECKOUT_URL: ${{ vars.NEXT_PUBLIC_CHECKOUT_URL }}
          NEXT_PUBLIC_META_PIXEL_ID: ${{ vars.NEXT_PUBLIC_META_PIXEL_ID }}
          NEXT_PUBLIC_UMAMI_SCRIPT_URL: ${{ vars.NEXT_PUBLIC_UMAMI_SCRIPT_URL }}
          NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
        run: |
          test -n "$NEXT_PUBLIC_SITE_URL" || { echo "NEXT_PUBLIC_SITE_URL is not set for this environment"; exit 1; }
          npm run build
          test -f out/.htaccess && test -f out/build-info.json && test -f out/index.html

      - name: Publish static export to the deploy branch
        env:
          SHA: ${{ steps.meta.outputs.sha }}
          BRANCH: ${{ steps.meta.outputs.branch }}
          REF_NAME: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Orphan commit containing only the exported files; history stays tiny.
          git checkout --orphan "$BRANCH-tmp"
          git rm -rfq --cached . >/dev/null
          find . -mindepth 1 -maxdepth 1 ! -name out ! -name .git -exec rm -rf {} +
          shopt -s dotglob
          mv out/* .
          rmdir out
          printf 'Static export of %s (%s). Built by the Deploy workflow; do not edit.\n' "$REF_NAME" "$SHA" > DEPLOY-README.txt
          git add -A
          git commit -qm "deploy: $REF_NAME ($SHA)"
          git push --force origin "HEAD:refs/heads/$BRANCH"
          echo "published $BRANCH at $(git rev-parse HEAD)"

      - name: Promote the source commit to the release branch (Hostinger Node.js Web App mode)
        # If the hPanel Node.js app is connected to `release` instead of `main`, this is what
        # triggers Hostinger's own build of exactly the approved commit.
        env:
          SHA: ${{ steps.meta.outputs.sha }}
          BRANCH: ${{ inputs.target == 'production' && 'release' || 'release-staging' }}
        run: git push --force origin "$SHA:refs/heads/$BRANCH"

  verify:
    name: Verify deployed revision
    needs: release
    uses: ./.github/workflows/post-deploy-verify.yml
    with:
      sha: ${{ needs.release.outputs.sha }}
      site_url: ${{ needs.release.outputs.site_url }}
