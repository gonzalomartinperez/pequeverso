<text x="32" y="75" fill="#bdcbd9" font-family="Arial, sans-serif" font-size="17" font-weight="400">Two clear product paths · native assistant remains disabled</text>
<rect x="32" y="104" width="976" height="100" rx="16" fill="#172a40" stroke="#486078"/>
