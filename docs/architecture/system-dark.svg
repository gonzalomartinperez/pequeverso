<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="880" viewBox="0 0 1040 880" aria-labelledby="title desc"><title id="title">Pequeverso storefront: two product paths, assistant disabled</title><desc id="desc">Home opens the first-party kit landing or the existing affiliate redirect to the external producer. Visitors choose whether to purchase through Hotmart. The native assistant has no launcher, runtime or API traffic while disabled. vps-ops owns future API infrastructure.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9aafc2"/></marker></defs><rect width="1040" height="880" rx="24" fill="#0f1b2d"/>
